name: API Tests - RH NET Social

on:
  # Disparado pelo pipeline da aplicação após o deploy (ver README)
  repository_dispatch:
    types: [deploy-hml, deploy-prd]
  # Execução manual
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente onde os testes serão executados"
        type: choice
        options: [hml, prd]
        default: hml
      testes:
        description: "Quais testes executar"
        type: choice
        options:
          - Todos
          - Smoke (essenciais e rápidos)
          - Regressão (regras de negócio)
        default: Todos

env:
  AMBIENTE: ${{ github.event.inputs.ambiente || (github.event.action == 'deploy-prd' && 'prd' || 'hml') }}

jobs:
  testes:
    name: Testes de API (${{ github.event.inputs.ambiente || (github.event.action == 'deploy-prd' && 'prd' || 'hml') }})
    # Versão fixa do Ubuntu: atualizações do runner não mudam o ambiente sem aviso.
    # Se a API só for acessível pela rede interna, troque por um runner self-hosted.
    runs-on: ubuntu-24.04
    # GitHub Environments "hml" e "prd": cada um com seus próprios secrets
    environment: ${{ github.event.inputs.ambiente || (github.event.action == 'deploy-prd' && 'prd' || 'hml') }}
    concurrency:
      group: api-tests-${{ github.event.inputs.ambiente || (github.event.action == 'deploy-prd' && 'prd' || 'hml') }}
      cancel-in-progress: true
    outputs:
      relatorio: ${{ steps.publicacao.outputs.relatorio }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Node.js e Allure baixados pelo plugin (o histórico vem da publicação, abaixo)
      - name: Restaurar ferramentas do Allure
        uses: actions/cache@v6
        with:
          path: |
            .allure
            !.allure/historico-*.jsonl
          key: allure-ferramentas-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Restaurar histórico de tendências publicado
        run: |
          mkdir -p .allure
          if git fetch --depth 1 origin relatorios 2> /dev/null \
             && git show "FETCH_HEAD:.historico/historico-$AMBIENTE.jsonl" > ".allure/historico-$AMBIENTE.jsonl" 2> /dev/null; then
            echo "Histórico de $AMBIENTE restaurado."
          else
            rm -f ".allure/historico-$AMBIENTE.jsonl"
            echo "Sem histórico publicado para $AMBIENTE: esta será a primeira execução do histórico."
          fi

      - name: Executar testes
        id: testes
        continue-on-error: true
        env:
          SCI_PARCEIRO_TOKEN: ${{ secrets.SCI_PARCEIRO_TOKEN }}
          SCI_SISTEMA_52_TOKEN: ${{ secrets.SCI_SISTEMA_52_TOKEN }}
          SCI_SISTEMA_19_TOKEN: ${{ secrets.SCI_SISTEMA_19_TOKEN }}
          SCI_CLIENTE_52_TOKEN: ${{ secrets.SCI_CLIENTE_52_TOKEN }}
          SCI_CLIENTE_19_TOKEN: ${{ secrets.SCI_CLIENTE_19_TOKEN }}
          SELECAO: ${{ github.event.inputs.testes }}
        run: |
          # Disparo automático (deploy): sem seleção, roda todos os testes
          case "$SELECAO" in
            Smoke*)     TAGS="@smoke" ;;
            Regressão*) TAGS="@regressao" ;;
            *)          TAGS="" ;;
          esac
          echo "Ambiente: $AMBIENTE | Testes: ${TAGS:-todos}"
          bash mvnw -B --no-transfer-progress test -Dkarate.env=$AMBIENTE ${TAGS:+-Dtags=$TAGS}

      - name: Gerar relatório Allure
        if: always() && hashFiles('target/allure-results/**') != ''
        env:
          ALLURE_AMBIENTE: ${{ env.AMBIENTE }}
        run: |
          bash mvnw -B --no-transfer-progress allure:report
          java scripts/NomeRelatorioAllure.java target/allure-report/index.html "$AMBIENTE"

      - name: Resumo da execução
        if: always()
        run: |
          if [ -f target/resumo-execucao.md ]; then
            cat target/resumo-execucao.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Testes de API - RH NET Social ($AMBIENTE)" >> "$GITHUB_STEP_SUMMARY"
            echo "A execução falhou antes dos testes. Veja o log do passo 'Executar testes'." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ github.event.client_payload.versao }}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Versão implantada: \`${{ github.event.client_payload.versao }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Arquivos repassados ao job de publicação (artefato temporário, apagado em 1 dia)
      - name: Preparar publicação
        id: publicacao
        if: always() && hashFiles('target/allure-report/index.html') != ''
        env:
          VERSAO: ${{ github.event.client_payload.versao }}
          RESULTADO: ${{ steps.testes.outcome == 'success' && 'passou' || 'falhou' }}
          EXECUCAO_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p publicacao
          cp target/allure-report/index.html publicacao/index.html
          cp ".allure/historico-$AMBIENTE.jsonl" publicacao/ 2> /dev/null || true
          # Dados do cartão da página inicial: números da execução + resultado, versão e link
          jq --arg resultado "$RESULTADO" --arg versao "$VERSAO" --arg url "$EXECUCAO_URL" \
             '. + {resultado: $resultado, execucaoUrl: $url} + (if $versao == "" then {} else {versao: $versao} end)' \
             target/resumo-execucao.json > publicacao/status.json
          echo "relatorio=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.publicacao.outputs.relatorio == 'true'
        with:
          name: publicacao-${{ env.AMBIENTE }}
          path: publicacao/
          retention-days: 1

      # Mantém o job como falho quando algum teste falhou (o relatório já foi preparado acima),
      # com uma mensagem objetiva no log e nos avisos (Annotations) da execução
      - name: Resultado final
        if: steps.testes.outcome == 'failure'
        run: |
          AMB="${AMBIENTE^^}"
          DONO="${GITHUB_REPOSITORY_OWNER,,}"
          URL="https://$DONO.github.io/${GITHUB_REPOSITORY#*/}/$AMBIENTE/"
          if [ -f target/resumo-execucao.json ]; then
            NOVAS=$(jq -r '.falhasNovas' target/resumo-execucao.json)
            CONHECIDAS=$(jq -r '.falhasConhecidas' target/resumo-execucao.json)
            TOTAL=$(jq -r '.total' target/resumo-execucao.json)
            echo "::error title=Falhas novas em $AMB::$NOVAS de $TOTAL cenários com falha nova em $AMB ($CONHECIDAS falha(s) conhecida(s)). Relatório: $URL"
          else
            echo "::error title=Testes não executados em $AMB::Não foi possível executar os testes em $AMB. Veja o log do passo 'Executar testes'."
          fi
          exit 1

      # Remove dependentes de teste que ficaram para trás (ex.: execução anterior interrompida).
      # Roda depois do relatório pronto e nunca altera o resultado da execução.
      - name: Limpeza de dados de teste órfãos
        if: always() && steps.testes.outcome != 'skipped'
        continue-on-error: true
        env:
          SCI_PARCEIRO_TOKEN: ${{ secrets.SCI_PARCEIRO_TOKEN }}
          SCI_SISTEMA_52_TOKEN: ${{ secrets.SCI_SISTEMA_52_TOKEN }}
          SCI_SISTEMA_19_TOKEN: ${{ secrets.SCI_SISTEMA_19_TOKEN }}
          SCI_CLIENTE_52_TOKEN: ${{ secrets.SCI_CLIENTE_52_TOKEN }}
          SCI_CLIENTE_19_TOKEN: ${{ secrets.SCI_CLIENTE_19_TOKEN }}
        run: |
          bash mvnw -B --no-transfer-progress test -Dkarate.env=$AMBIENTE -Dtags=@limpeza -Drodar=true \
            -Dmaven.test.failure.ignore=true > target/limpeza.log 2>&1 || true
          if [ -f target/limpeza.txt ]; then
            cat target/limpeza.txt
            { echo ""; echo "**Limpeza de dados de teste:**"; sed 's/^/- /' target/limpeza.txt; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Limpeza não concluída::Veja o log do passo 'Limpeza de dados de teste órfãos'."
            tail -n 30 target/limpeza.log
          fi

  publicar:
    name: Publicar relatório (${{ github.event.inputs.ambiente || (github.event.action == 'deploy-prd' && 'prd' || 'hml') }})
    needs: testes
    # Publica sempre que houver relatório, inclusive quando há testes falhando
    if: always() && needs.testes.outputs.relatorio == 'true'
    runs-on: ubuntu-24.04
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: write   # salvar o site na branch "relatorios"
      pages: write      # publicar no GitHub Pages
      id-token: write   # exigido pela publicação no GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Uma publicação por vez (hml e prd compartilham o mesmo site)
    concurrency:
      group: publicacao-relatorios
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: publicacao-${{ env.AMBIENTE }}
          path: ${{ runner.temp }}/publicacao

      - name: Montar o site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publicar-relatorio.sh "$AMBIENTE" "${{ runner.temp }}/publicacao" "${{ runner.temp }}/site"

      # Pastas ocultas (como .historico) ficam fora do site publicado
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Link do relatório
        run: |
          URL="${{ steps.deploy.outputs.page_url }}$AMBIENTE/"
          echo "Relatório publicado: $URL"
          echo "### Relatório publicado: [$AMBIENTE]($URL)" >> "$GITHUB_STEP_SUMMARY"

  notificar:
    name: Notificar no Discord
    needs: [testes, publicar]
    # Avisa sempre, inclusive quando os testes falham ou nem chegam a rodar (exceto se cancelado)
    if: always() && needs.testes.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      # Dados da execução (não existe quando os testes não chegaram a rodar)
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: publicacao-${{ env.AMBIENTE }}
          path: ${{ runner.temp }}/publicacao

      - name: Enviar aviso
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELATORIO_URL: ${{ needs.publicar.outputs.url && format('{0}{1}/', needs.publicar.outputs.url, env.AMBIENTE) || '' }}
          EXECUCAO_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/notificar_discord.py "$AMBIENTE" "${{ runner.temp }}/publicacao/status.json"
